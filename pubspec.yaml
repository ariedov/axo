name: app
description: "Аксо — трекер звичок з рожевим аксолотлем."
publish_to: "none"
version: 1.2.4+10

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  file_picker: ^12.1.2
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
  windows:
    generate: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#F9AFBB"
  adaptive_icon_background: "#F9AFBB"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/data/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont_wght.ttf
